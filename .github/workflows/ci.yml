# .github/workflows/ci.yml
#
# Continuous Integration for Rashi1005/Uplift-Casual-ML
# -------------------------------------------------------
# Four jobs, each with a distinct purpose:
#
#   lint        Runs on every push and PR.  Fast (~10 s): just installs ruff
#               and checks that src/ and tests/ are clean.  Fails the PR
#               before any tests run if there are formatting or lint errors.
#
#   test-fast   Runs on every push and PR (matrix: Python 3.11 + 3.12).
#               Installs the lean CI requirements (no jupyter, no econml)
#               and runs the 60 fast tests (~40 s).  Does NOT download the
#               Hillstrom dataset — all tests use small synthetic fixtures.
#
#   test-full   Runs ONLY on pushes to main.  Installs the full CI
#               requirements (including econml) and runs all 66 tests,
#               including the @pytest.mark.slow Causal Forest fits (~2.5 min).
#               Upload JUnit XML test results as a downloadable artifact.
#
#   cli-smoke   Runs on every push and PR.  Verifies that all seven CLI
#               subcommands are importable and expose a --help page (a quick
#               sanity check that argument parsing is wired correctly and
#               nothing crashes on import).  No dataset or model artifacts
#               are required.
#
# Secrets required: NONE
# External services: NONE
# Dataset downloads: NONE (all tests use synthetic fixtures)
#
# ── Running the same checks locally ────────────────────────────────────────
#
#   # Lint (matches the lint job exactly):
#   pip install ruff==0.16.10
#   ruff check src/ tests/
#   ruff format --check src/ tests/
#
#   # Fast tests — no econml needed (matches test-fast on Python 3.12):
#   pip install -r requirements-ci.txt
#   pytest -m "not slow" -v
#
#   # Full tests — includes Causal Forest fits (matches test-full):
#   pip install -r requirements-ci.txt && pip install econml
#   pytest -v
#
#   # CLI smoke (matches cli-smoke job):
#   python -m src.cli --help
# ───────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed,
# so stale PR builds don't waste runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prevent Python from buffering stdout/stderr so log lines appear in order.
  PYTHONUNBUFFERED: "1"
  # Suppress pip's "new version available" upgrade notice in CI logs.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip caching here — we only install ruff, which is tiny.

      - name: Install ruff
        # Pin to the same version used during development (see pyproject.toml).
        run: pip install ruff==0.16.10

      - name: "ruff check — linting"
        run: ruff check src/ tests/

      - name: "ruff format --check — formatting"
        # --check exits non-zero if any file would be reformatted.
        # Developers should run `ruff format src/ tests/` locally to fix.
        run: ruff format --check src/ tests/

  # ── 2. Fast test suite (every push + PR) ──────────────────────────────────
  test-fast:
    name: "Tests — fast suite (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    # Run this after lint so we don't waste a runner slot if lint fails.
    needs: lint

    strategy:
      fail-fast: false   # keep testing on 3.12 even if 3.11 fails and vice versa
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        # requirements-ci.txt intentionally omits: jupyter, matplotlib,
        # seaborn (lazy imports, unused in tests), and econml (slow tests only).
        run: pip install -r requirements-ci.txt

      - name: "Run fast test suite (pytest -m 'not slow')"
        run: |
          mkdir -p test-results
          pytest -m "not slow" -v --tb=short \
            --junit-xml=test-results/fast-py${{ matrix.python-version }}.xml

      - name: Upload JUnit test results
        # Upload even when tests fail so the failure is diagnosable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 14

  # ── 3. Full test suite (pushes to main only) ──────────────────────────────
  test-full:
    name: "Tests — full suite (including slow Causal Forest fits)"
    runs-on: ubuntu-latest
    # Only run on pushes to main, not on every PR — the Causal Forest fits
    # take ~2.5 min each and econml is a large install.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Cache key covers both files so a change in either invalidates it.
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Install econml (required for @pytest.mark.slow Causal Forest tests)
        # Installed separately from requirements-ci.txt so the fast-suite job
        # can skip it without maintaining two separate requirements files.
        run: pip install econml

      - name: "Run full test suite (all 66 tests)"
        run: |
          mkdir -p test-results
          pytest -v --tb=short \
            --junit-xml=test-results/full-py3.12.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results-py3.12
          path: test-results/
          retention-days: 30   # keep full-suite results for a month

  # ── 4. CLI smoke test ─────────────────────────────────────────────────────
  cli-smoke:
    name: "CLI smoke test"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: "Verify CLI top-level --help"
        # Confirms that src/cli.py imports cleanly and argparse is wired correctly.
        run: python -m src.cli --help

      - name: "Verify all subcommand --help pages"
        # Each subcommand's help string is generated from its add_parser() call —
        # exercising all seven confirms the full argument-parsing tree is intact.
        run: |
          for cmd in prepare-data preprocess train-baseline train-uplift evaluate simulate run-all; do
            echo "--- $cmd ---"
            python -m src.cli $cmd --help
          done

      - name: "Verify CLI fails loudly on a missing processed directory"
        # train-baseline with a nonexistent directory should exit 1 and print
        # ERROR — not crash with a raw traceback or silently succeed.
        run: |
          python -m src.cli train-baseline \
            --processed-dir /tmp/does-not-exist-ci-smoke 2>&1 | tee /tmp/cli_smoke_err.txt
          grep -q "ERROR" /tmp/cli_smoke_err.txt || \
            (echo "FAIL: expected ERROR in output" && exit 1)
