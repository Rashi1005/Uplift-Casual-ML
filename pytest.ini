[pytest]
# Registering markers explicitly so `pytest --strict-markers` (or a CI
# pipeline that enables it) doesn't reject them, and so `pytest --markers`
# documents what each one means.
markers =
    slow: tests that are correct but noticeably slower than the rest of the
        suite (e.g. an actual Causal Forest fit, even on a tiny dataset,
        or the CLI's multi-command chain test). Excluded by default in CI
        fast-path runs via `pytest -m "not slow"`; run explicitly with
        `pytest -m slow` or included in a full run with plain `pytest`.
    integration: tests that exercise more than one module together (e.g.
        the CLI end-to-end command chain), as opposed to a single
        function in isolation.

testpaths = tests

# sklift's qini_curve/qini_auc_score call a deprecated sklearn utility
# internally on every call -- an upstream library detail unrelated to
# this project's own code, silenced here so real warnings from this
# project's own code aren't lost in the noise.
filterwarnings =
    ignore:Function stable_cumsum is deprecated:FutureWarning